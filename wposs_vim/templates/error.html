{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="empty">
  <p class="empty-title">{{ 'No encontrado' if code == 404 else 'No se pudo completar la operación' }}</p>
  <p class="muted">{{ message }}</p>
  <a class="btn" href="{{ url_for('main.dashboard') }}">Ir al dashboard</a>
</div>
{% endblock %}
